<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Birthday Sunad</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#ffffff 0%,#77C2FC 75%,#5B99CB 100%);
}

/* ================= NAVBAR ================= */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 60px;
  background:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.profile-logo{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.title-logo{
  height:32px;
  border-radius:6px;
}

.nav-links a{
  margin-left:30px;
  text-decoration:none;
  font-weight:500;
  color:#1e3a8a;
  transition:0.3s;
}

.nav-links a:hover,
.nav-links a.active{
  color:#ff6a00;
}

/* ================= MAIN ================= */
.main{
  display:flex;
  justify-content:space-around;
  align-items:flex-start;
  padding:60px 60px;
  gap:50px;
}

/* ================= LEFT CARD ================= */
.card{
  background:#fff;
  padding:6px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  width:420px;
  animation:fadeUp 1s ease forwards;
}

.card img{
  width:100%;
  border-radius:15px;
}

/* ================= RIGHT ================= */
.right{
  text-align:center;
  animation:fadeUp 1.2s ease forwards;
  position:relative;
  z-index:5;
}

.profile-stack{
  position:relative;
  width:320px;
  margin:0 auto -100px; /* Pulls content upward slightly */
  z-index:1;
}

.profile-img{
  width:240px;
  height:240px;
  border-radius:50%;
  background:#fff;
}

.curve-img{
  width:360px;
  margin-top:-65px;
  margin-left:-15px;
  pointer-events:none; /* 🔥 IMPORTANT FIX */
}

/* ================= BUTTON ================= */
.btn{
  display:inline-block;
  margin-top:35px;
  padding:14px 35px;
  background:#4CAF50;
  color:#fff;
  border-radius:30px;
  text-decoration:none;
  font-size:16px;
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
  transition:0.3s;
  position:relative;
  z-index:10;
}

.btn:hover{
  transform:scale(1.08);
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* ================= QUOTE ================= */
.quote{
  margin-top:12px;
  font-size:13px;
  font-style:italic;
  color:#555;
}

/* ================= ANIMATION ================= */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ================= RESPONSIVE ================= */
@media(max-width:900px){
  .main{
    flex-direction:column;
    align-items:center;
  }
}
</style>
</head>

<body>

<nav class="navbar">
  <div class="logo">
    <img src="profile.png" class="profile-logo">
    <img src="logo.png" class="title-logo">
  </div>
  <div class="nav-links">
    <a href="index.html" class="active">Home</a>
    <a href="memories.html">Memories</a>
    <a href="journey.html">Journey</a>
    <a href="echoes.html">Echoes</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<section class="main">

  <div class="card">
    <img src="birthday.png" alt="Birthday Card">
  </div>

  <div class="right">
    <div class="profile-stack">
      <img src="sunad.png" class="profile-img">
      <img src="Ellipse 8.png" class="curve-img">
    </div>

    <!-- ✅ WORKING BUTTON -->
    <a href="memories.html" class="btn">Play the Memories</a>

    <div class="quote">
      "Some memories are better felt than explained"
    </div>
  </div>

</section>

</body>
</html>
