<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Birthday Sunad</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#ffffff 0%,#77C2FC 75%,#5B99CB 100%);
}

/* ================= NAVBAR ================= */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 60px;
  background:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.profile-logo{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.title-logo{
  height:32px;
  border-radius:6px;
}

.nav-links a{
  margin-left:30px;
  text-decoration:none;
  font-weight:500;
  color:#1e3a8a;
  transition:0.3s;
}

.nav-links a:hover,
.nav-links a.active{
  color:#ff6a00;
}

/* ================= MAIN ================= */
.main{
  display:flex;
  justify-content:space-around;
  align-items:flex-start;
  padding:60px;
  gap:50px;
}

/* ================= LEFT CARD ================= */
.card{
  background:#fff;
  padding:6px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  width:420px;
  animation:fadeUp 1s ease forwards;
  transition:0.4s ease;
}

.card img{
  width:100%;
  border-radius:15px;
}

/* Hover Effect */
.card:hover{
  transform: translateY(-8px) scale(1.03);
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

/* ================= RIGHT ================= */
.right{
  text-align:center;
  animation:fadeUp 1.2s ease forwards;
  position:relative;
  z-index:5;
}

.profile-stack{
  position:relative;
  width:320px;
  margin:0 auto -100px;
}

.profile-img{
  width:240px;
  height:240px;
  border-radius:50%;
  background:#fff;
  transition:0.4s ease;
}

/* Hover Effect */
.profile-img:hover{
  transform: scale(1.08);
  box-shadow: 0 15px 35px rgba(0,0,0,0.3);
}
.Birthday-Card:hover{
  transform: scale(1.08);
  box-shadow: 0 15px 35px rgba(0,0,0,0.3);
}

.curve-img{
  width:360px;
  margin-top:-65px;
  margin-left:-15px;
  pointer-events:none;
}

/* ================= BUTTON ================= */

.btn{
  display:inline-block;
  margin-top:35px;
  padding:14px 35px;
  background:#4CAF50;
  color:#fff;
  border-radius:30px;
  text-decoration:none;
  font-size:16px;
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
  transition:0.3s;
  position:relative;
  z-index:10;
}


.btn:hover{
  transform:scale(1.08);
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* ================= QUOTE ================= */
.quote{
  margin-top:12px;
  font-size:13px;
  font-style:italic;
  color:#555;
}

/* ================= ANIMATION ================= */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
.menu-toggle{
  display:none;
  font-size:24px;
  cursor:pointer;
  color:#1e3a8a;
  margin-right:10px;
}
/* ================= MOBILE RESPONSIVE ================= */
@media(max-width:900px){
  .main{
    flex-direction:column;
    align-items:center;
    padding:40px 20px;
  }

  .card{
    width:100%;
    max-width:360px;
  }

  .profile-stack{
    width:100%;
    margin:0 auto -60px;
  }

  .profile-img{
    width:180px;
    height:180px;
  }

  .curve-img{
    width:260px;
    margin-top:-45px;
    margin-left:-10px;
  }

  .btn{
    margin-top:25px;
    padding:12px 30px;
    font-size:15px;
  }

  .quote{
    font-size:12px;
  }

 .menu-toggle{
  display:block;
  margin-left:-32px;   /* moves it further left */
  font-size:24px;
  cursor:pointer;
}

.navbar{
  justify-content:flex-start;
  gap:12px;
}

.nav-links{
  position:absolute;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  width:50%;
  background:#fff;
  border-radius:12px;
  flex-direction:column;
  align-items:center;
  display:none;
  padding:15px 0;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.nav-links a{
  margin:10px 0;
  font-size:16px;
}

.nav-links.active{
  display:flex;
}

}
</style>
</head>

<body>
  
<nav class="navbar">

  <!-- Hamburger -->
  <div class="menu-toggle" id="menu-toggle">
    <i class="fa-solid fa-bars"></i>
  </div>

  <div class="logo">
    <img src="profile.png" class="profile-logo">
    <img src="logo.png" class="title-logo">
  </div>

  <div class="nav-links" id="nav-links">
    <a href="index.html" class="active">Home</a>
    <a href="memories.html">Memories</a>
    <a href="journey.html">Journey</a>
    <a href="echoes.html">Echoes</a>
    <a href="contact.html">Contact</a>
  </div>

</nav>

<section class="main">

  <div class="card">
    <img src="birthday.png" class="Birthday-Card">
  </div>

  <div class="right">
    <div class="profile-stack">
      <img src="sunad.png" class="profile-img">
      <img src="Ellipse 8.png" class="curve-img">
    </div>

    <a href="memories.html" class="btn">Play the Memories</a>

    <div class="quote">
      "Some memories are better felt than explained"
    </div>
  </div>

</section>

<script>
const toggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");

toggle.addEventListener("click", function(){
  navLinks.classList.toggle("active");
});
</script>

</body>
</html>
