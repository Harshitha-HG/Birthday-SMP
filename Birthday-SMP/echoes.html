<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoes</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#ffffff 0%,#77C2FC 75%,#5B99CB 100%);
}

/* ================= NAVBAR ================= */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 60px;
  background:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.profile-logo{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.title-logo{
  height:32px;
  border-radius:6px;
}

.nav-links a{
  margin-left:30px;
  text-decoration:none;
  font-weight:500;
  color:#1e3a8a;
  transition:.3s;
}

.nav-links a:hover,
.nav-links a.active{
  color:#ff6a00;
}

/* ================= MAIN SECTION ================= */
.echo-container{
  padding:60px 20px;
  text-align:center;
  animation:fadeUp 1s ease forwards;
}

/* ================= IMAGE WRAPPER ================= */
.echo-image{
  width:85%;
  max-width:850px;
  margin:0 auto;
  border-radius:8px;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  overflow:hidden;
  animation:pop 1.2s ease forwards;
}

.echo-image img{
  width:100%;
  display:block;
}
/* ================= BUTTON ================= */
.btn{
  display:inline-block;
  margin-top:30px;
  padding:14px 40px;
  background:#4CAF50;
  color:#fff;
  border-radius:30px;
  text-decoration:none;
  font-size:16px;
  transition:.3s;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.btn:hover{
  transform:scale(1.08);
}

/* ================= FOOTER TEXT ================= */
.footer{
  margin-top:15px;
  font-size:13px;
  font-style:italic;
  color:#555;
}

/* ================= ANIMATIONS ================= */
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(40px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(0.95);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}
.menu-toggle{
  display:none;
  font-size:24px;
  cursor:pointer;
  color:#1e3a8a;
  margin-right:10px;
}
/* ================= MOBILE RESPONSIVE ================= */
@media(max-width:900px){

.menu-toggle{
  display:block;
  margin-left:-32px;   /* moves it further left */
  font-size:24px;
  cursor:pointer;
}

.navbar{
  justify-content:flex-start;
  gap:12px;
}

.nav-links{
  position:absolute;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  width:50%;
  background:#fff;
  border-radius:12px;
  flex-direction:column;
  align-items:center;
  display:none;
  padding:15px 0;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

.nav-links a{
  margin:10px 0;
  font-size:16px;
}

.nav-links.active{
  display:flex;
}

  .echo-container{
    padding:40px 15px;
  }

  .echo-image{
    width:100%;
    max-width:100%;
    border-radius:6px;
  }
  .btn{
    padding:12px 30px;
    font-size:15px;
  }

  .footer{
    font-size:12px;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

  <!-- Hamburger -->
  <div class="menu-toggle" id="menu-toggle">
    <i class="fa-solid fa-bars"></i>
  </div>

  <div class="logo">
    <img src="profile.png" class="profile-logo">
    <img src="logo.png" class="title-logo">
  </div>

  <div class="nav-links" id="nav-links">
    <a href="index.html">Home</a>
    <a href="memories.html">Memories</a>
    <a href="journey.html">Journey</a>
    <a href="echoes.html" class="active">Echoes</a>
    <a href="contact.html">Contact</a>
  </div>

</nav>

<!-- MAIN CONTENT -->
<section class="echo-container">

  <div class="echo-image">
    <img src="echo-letter.jpg" alt="Echo Letter">
  </div>
   <a href="contact.html" class="btn">Contact Me</a>

  <div class="footer">
    Glad you’re here — feel free to reach out 😊
  </div>

</section>

<script>
const toggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");

toggle.addEventListener("click", function(){
  navLinks.classList.toggle("active");
});
</script>

</body>
</html>
